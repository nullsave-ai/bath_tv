name: Build Flutter TV APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Base Project and Build
        run: |
          WORKSPACE_DIR=$PWD
          chmod +x setup.sh
          bash setup.sh

          # Build split-per-abi for small size and universal APK
          flutter build apk --release --split-per-abi
          flutter build apk --release

          mkdir -p "$WORKSPACE_DIR/dist"
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk "$WORKSPACE_DIR/dist/bath_tv-arm64.apk"
          cp app-armeabi-v7a-release.apk "$WORKSPACE_DIR/dist/bath_tv-arm32.apk"
          cp app-release.apk "$WORKSPACE_DIR/dist/bath_tv-universal.apk"
          ls -lh "$WORKSPACE_DIR/dist/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bath_tv_apks
          path: dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Bath TV v1.0.${{ github.run_number }} (Updated)"
          body: |
            ### تطبيق بث تي في (Bath TV) - تحديث النسخة الأولى:
            * **`bath_tv-arm64.apk`**: **النسخة الموصى بها لهاتفك (Tecno Camon 30) وللهواتف والشاشات الحديثة (64-bit)**.
            * **`bath_tv-arm32.apk`**: للأجهزة والشاشات القديمة (32-bit).
            * **`bath_tv-universal.apk`**: النسخة الشاملة لجميع الأجهزة.
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
